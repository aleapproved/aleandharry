name: pages

# Publishes to Cloudflare Pages. The site is hand-written static HTML with no
# build step, so this stages the files that make up the site and uploads them.
# Staging rather than uploading the repo root keeps the checks, the badge
# tooling and the worker's source off the public site: they belong in the
# repo, not at aleandharry.com/worker/src/index.js.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue pushes rather than cancelling the one in flight, so a cancelled deploy
# cannot leave a half-uploaded site published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='node_modules' \
            --exclude='test' \
            --exclude='tools' \
            --exclude='worker' \
            --exclude='*.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            . _site/

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret: the account ID identifies the account but authorises
          # nothing without the token above, and Cloudflare puts it in dashboard
          # URLs. Naming it here beats a second repo secret to keep in sync.
          accountId: 010ccfd71330e904562ca7fa44707d68
          command: pages deploy _site --project-name=aleandharry --branch=main
