<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ale &amp; Harry</title>
  <meta name="description" content="A Hale wedding website.">
  <link rel="canonical" href="https://aleandharry.com/">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#f7ecdd">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#1b1830' : '#f7ecdd');
      } catch (e) {}
    })();
  </script>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aleandharry.com/">
  <meta property="og:title" content="Ale &amp; Harry">
  <meta property="og:description" content="A Hale wedding website.">
  <meta property="og:image" content="https://aleandharry.com/images/og-image.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ale &amp; Harry">
  <meta name="twitter:description" content="A Hale wedding website.">
  <meta name="twitter:image" content="https://aleandharry.com/images/og-image.jpg">
  <link rel="stylesheet" href="/styles.css">
  <style>
    main {
      justify-content: center;
      flex: 1;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">Ale <span class="amp">&amp;</span> Harry</a>
    <div class="nav-group">
      <nav>
        <a href="/our-story.html">Our Story</a>
      </nav>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
        <img class="theme-icon-light" src="/images/solrock-icon.png" alt="" aria-hidden="true">
        <img class="theme-icon-dark" src="/images/lunatone-icon.png" alt="" aria-hidden="true">
      </button>
    </div>
  </header>
  <main>
    <p class="eyebrow">We're getting married</p>
    <h1>Ale<span class="amp">&amp;</span>Harry</h1>
    <div class="rule"></div>
  </main>
  <script src="/theme-toggle.js" defer></script>
</body>
</html>
