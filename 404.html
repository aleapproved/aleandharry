<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found &ndash; Ale &amp; Harry</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#f7ecdd">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#1b1830' : '#f7ecdd');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">Ale <span class="amp">&amp;</span> Harry</a>
    <div class="nav-group">
      <nav>
        <a href="/our-story.html">Our Story</a>
        <a href="/the-day.html">The Day</a>
        <a href="/travel.html">Travel</a>
        <a href="/rsvp.html">RSVP</a>
      </nav>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
        <img class="theme-icon-light" src="/images/solrock-icon.png" alt="" aria-hidden="true">
        <img class="theme-icon-dark" src="/images/lunatone-icon.png" alt="" aria-hidden="true">
      </button>
    </div>
  </header>
  <main class="centered">
    <p class="eyebrow">404</p>
    <p class="quote">&ldquo;There&rsquo;s a time and place for everything, but not now.&rdquo;</p>
    <div class="rule"></div>
    <p><a href="/">Take me back</a></p>
  </main>
  <script src="/theme-toggle.js" defer></script>
</body>
</html>
